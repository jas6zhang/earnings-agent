[project]
name = "earnings-agent"
version = "0.1.0"
description = "Filings-first earnings monitor: EDGAR 8-K guidance extraction with a late-arriving transcript enrichment hook"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.0",
    # Covers every free provider worth using - they all speak /chat/completions.
    "openai>=1.50",
    # Local web UI.
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "markdown>=3.5",
]

[project.optional-dependencies]
# Only needed if you point llm.provider at "anthropic".
claude = ["anthropic>=0.40"]

[project.scripts]
earnings-agent = "earnings_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["earnings_agent"]
